services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_LOCAL_PORT:-8000}:80"
    volumes:
      - ./data:/app/data
    environment:
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      CHATGPT2API_AUTH_KEY: "${CHATGPT2API_AUTH_KEY:?Set CHATGPT2API_AUTH_KEY in .env}"
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_CONFIG_FILE: /app/data/config.json
